name: safe_campus_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.2.2
  flutter_riverpod: ^3.0.3
  http: ^1.6.0
  image_picker: ^1.2.1
  latlong2: ^0.9.1
  google_maps_flutter: ^2.14.0
  flutter_local_notifications: ^19.5.0
  permission_handler: ^12.0.1
  firebase_messaging: ^16.1.0
  firebase_storage: ^13.0.5
  cloud_firestore: ^6.1.1
  firebase_core: ^4.3.0
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - .env            # Ortam değişkenleri (flutter_dotenv)
    - assets/images/  # Sonlarına / ekle
    - assets/icons/
    - assets/gifs/    # Senin eklediğin kısım burası ve / ile bitmeli